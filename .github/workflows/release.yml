name: Documentation Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create release archive
        run: |
          tar             --exclude=.git             --exclude=.venv             --exclude=site             -czf "EAODS-${GITHUB_REF_NAME}.tar.gz" .
      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra

      - name: Build framework PDF library
        run: |
          mkdir -p pdf
          for f in docs/frameworks/EAODS-v17.3/*.md; do
            base=$(basename "$f" .md)
            pandoc "$f" -o "pdf/${base}.pdf" \
              --from=gfm --pdf-engine=xelatex -V geometry:margin=2.5cm \
              -V colorlinks=true --toc || echo "skip $base"
          done
          tar -czf "EAODS-${GITHUB_REF_NAME}-pdf-library.tar.gz" pdf
          ls -la pdf

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: "EAODS-${{ github.ref_name }}-sbom.spdx.json"
          output-file: "EAODS-${{ github.ref_name }}-sbom.spdx.json"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            EAODS-${{ github.ref_name }}.tar.gz
            EAODS-${{ github.ref_name }}-sbom.spdx.json
            EAODS-${{ github.ref_name }}-pdf-library.tar.gz
