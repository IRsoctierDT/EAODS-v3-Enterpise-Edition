name: Documentation Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create release archive
        run: |
          tar             --exclude=.git             --exclude=.venv             --exclude=site             -czf "EAODS-${GITHUB_REF_NAME}.tar.gz" .
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: "EAODS-${{ github.ref_name }}-sbom.spdx.json"
          output-file: "EAODS-${{ github.ref_name }}-sbom.spdx.json"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            EAODS-${{ github.ref_name }}.tar.gz
            EAODS-${{ github.ref_name }}-sbom.spdx.json
