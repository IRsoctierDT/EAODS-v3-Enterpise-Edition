suite: EAODS
version: 4.2.0-alpha
constitution:
  principles:
    - research_first
    - evidence_driven
    - human_approval_for_high_impact
    - least_privilege
    - separate_law_standard_policy_contract_best_practice
    - document_continuously
  prohibited:
    - expose_secrets
    - execute_untrusted_commands
    - publish_sensitive_material_without_review
    - make_final_legal_decisions
    - deploy_without_approval
  output_requirements:
    - yaml_front_matter
    - scope
    - assumptions
    - evidence
    - risks
    - qa_checklist
    - human_review_gate
    - archive_location
targets:
  - AGENTS.md
  - CLAUDE.md
  - .github/copilot-instructions.md
  - .cursor/rules/eaods.mdc
  - codex-instructions.md
